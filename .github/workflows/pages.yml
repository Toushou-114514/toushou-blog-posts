name: Deploy Markdown to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert Markdown to HTML
        uses: wranders/markdown-to-pages-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            posts/*.md
          out_path: dist
          title: Toushou 投手的博客

      # ===== 新增：生成 index.json =====
      - name: Generate index.json
        run: |
          cd dist/posts
          echo '[' > index.json
          for f in *.html; do
            base=$(basename "$f" .html)
            date=$(echo "$base" | cut -d'-' -f1-3)
            title=$(echo "$base" | cut -d'-' -f4- | tr '-' ' ')
            echo '{"filename":"'$f'","title":"'$title'","date":"'$date'"},' >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo ']' >> index.json
        shell: bash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
